
trigger:
  branches:
    include:
      - dev  

pool:
  vmImage: 'ubuntu-latest'

variables:
  IMAGE_NAME: 'olego700/flask-aws-monitor' 
  # DOCKERHUB_USERNAME and DOCKERHUB_PASSWORD will be stored in Azure DevOps secrets

resources:
  repositories:
    - repository: self
      type: git
      ref: dev

stages:
- stage: CloneRepository
  displayName: 'Clone Repository'
  jobs:
  - job: Clone
    steps:
    - checkout: self
      submodules: true

- stage: ParallelChecks
  displayName: 'Parallel Linting & Security Checks'
  dependsOn: CloneRepository
  jobs:
  - job: Linting
    displayName: 'Python Linting'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'
    - script: |
        python -m pip install --upgrade pip
        pip install flake8
        flake8 app/app.py --max-line-length=120 || true
      displayName: 'Run Flake8 Linting'

  - job: SecurityScan
    displayName: 'Security Scanning'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.x'
    - script: |
        python -m pip install --upgrade pip
        pip install safety
        safety check -r app/requirements.txt
      displayName: 'Run Safety Security Scan'

- stage: BuildDockerImage
  displayName: 'Build Docker Image'
  dependsOn: ParallelChecks
  jobs:
  - job: BuildImage
    steps:
    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        command: build
        repository: $(IMAGE_NAME)
        tags: latest
        dockerfile: app/Dockerfile
        buildContext: app

- stage: PushToDockerHub
  displayName: 'Push to Docker Hub'
  dependsOn: BuildDockerImage
  jobs:
  - job: PushImage
    steps:
    - task: Docker@2
      displayName: 'Login to Docker Hub'
      inputs:
        command: login
        containerRegistry: 'dockerhub-connection'  
    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        command: push
        repository: $(IMAGE_NAME)
        tags: latest

